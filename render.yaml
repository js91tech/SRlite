services:
  - type: web
    name: srlite
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GA511_API_KEY
        sync: false
    disk:
      name: srlite-data
      mountPath: /opt/render/project/src/server/data
      sizeGB: 1
