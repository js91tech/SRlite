<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Need Roadside Help?</title>
    <style>
      :root { font-family: system-ui, sans-serif; background: #0f1419; color: #e8edf4; }
      body { max-width: 420px; margin: 2rem auto; padding: 1rem; }
      h1 { font-size: 1.35rem; }
      label { display: block; margin-top: 1rem; font-size: 0.9rem; }
      input, textarea, button {
        width: 100%; margin-top: 0.35rem; padding: 0.65rem;
        border-radius: 8px; border: 1px solid #2d3a4f;
        background: #1a2332; color: inherit; font: inherit;
      }
      button { background: #3b82f6; border: none; color: white; cursor: pointer; margin-top: 1rem; }
      .msg { margin-top: 1rem; padding: 0.75rem; border-radius: 8px; }
      .ok { background: #14532d; }
      .err { background: #7f1d1d; }
      p.sub { color: #8b9cb3; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <h1>Need roadside help?</h1>
    <p class="sub">Share your location and we'll dispatch the nearest truck.</p>
    <form id="form">
      <label>Phone number
        <input name="phone" type="tel" placeholder="+16785550123" required />
      </label>
      <label>What happened?
        <textarea name="issue" rows="3" required>Car won't start - need assistance</textarea>
      </label>
      <button type="submit">Send Help Request</button>
    </form>
    <div id="msg"></div>
    <script>
      const form = document.getElementById("form");
      const msg = document.getElementById("msg");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        msg.textContent = "Getting your location…";
        msg.className = "msg";
        try {
          const pos = await new Promise((ok, err) =>
            navigator.geolocation.getCurrentPosition(ok, err, { enableHighAccuracy: true, timeout: 15000 })
          );
          const fd = new FormData(form);
          const res = await fetch("/api/leads", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              source_type: "self_report",
              source_provider: "help_link",
              issue_description: fd.get("issue"),
              lat: pos.coords.latitude,
              lng: pos.coords.longitude,
              contactable: true,
              contact_phone: fd.get("phone"),
              contact_method: "sms",
            }),
          });
          if (!res.ok) throw new Error((await res.json()).error || "Request failed");
          msg.textContent = "Help is on the way! A dispatcher will contact you shortly.";
          msg.className = "msg ok";
          form.reset();
        } catch (err) {
          msg.textContent = err.message || "Could not send request. Allow location access and try again.";
          msg.className = "msg err";
        }
      });
    </script>
  </body>
</html>
